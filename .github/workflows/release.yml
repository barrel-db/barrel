name: Release

# The Barrel bundle: a push to main that passes CI and bumps at least one
# app's version is released as YYYY.MM.N (tag vYYYY.MM.N), N counting the
# bundles of that month from 0. The release notes list every app's version
# and the CHANGELOG sections of the apps whose version changed since the
# previous bundle; the release carries barrel_server tarballs, and the image
# goes to ghcr.io/barrel-db/barrel-server as :YYYY.MM.N and :latest. Apps are
# not tagged: each is published to Hex on its own. A push that bumps no app
# releases nothing.
#
# A pull request touching the release runs it dry: notes and tarballs are
# built, nothing is tagged, pushed or released.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle_notes.sh
      - rebar.config

permissions:
  contents: write
  packages: write

# bundles from main run one after the other; a pull request's dry run has its own
concurrency:
  group: release-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.n.outputs.bundle }}
      sha: ${{ steps.n.outputs.sha }}
      publish: ${{ steps.n.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: n
        name: Bundle name
        run: |
          sha="$(git rev-parse HEAD)"
          match='v20[0-9][0-9].[0-9][0-9].*'
          prev="$(git describe --tags --match "$match" --abbrev=0 "$sha^" 2>/dev/null || echo -)"
          bundle=""
          if [ -n "$(git tag --points-at "$sha" -l "$match")" ]; then
            echo "already released: $(git tag --points-at "$sha" -l "$match")"
          elif [ -z "$(scripts/bundle_notes.sh --changed "$prev" "$sha")" ]; then
            echo "no app version changed since $prev: nothing to release"
          else
            ym="$(TZ=UTC git log -1 --date=format-local:%Y.%m --format=%cd "$sha")"
            bundle="$ym.$(git tag -l "v$ym.*" | wc -l | tr -d ' ')"
          fi
          publish=false
          if [ -n "$bundle" ] && [ "${{ github.event_name }}" = workflow_run ]; then
            publish=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Notes
        if: steps.n.outputs.bundle != ''
        run: |
          scripts/bundle_notes.sh "${{ steps.n.outputs.prev }}" HEAD > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.n.outputs.bundle != ''
        with:
          name: notes
          path: notes.md

  tarball:
    needs: plan
    if: needs.plan.outputs.bundle != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      BARREL_BUNDLE: ${{ needs.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev zlib1g-dev \
            libsnappy-dev liblz4-dev libzstd-dev
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: brew install cmake snappy lz4 zstd
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.25.0'
      - name: Build
        run: |
          rebar3 as s3_server,prod tar -n barrel_server
          cp "_build/s3_server+prod/rel/barrel_server/barrel_server-$BARREL_BUNDLE.tar.gz" \
             "barrel_server-$BARREL_BUNDLE-${{ matrix.target }}.tar.gz"
      - name: Starts
        run: |
          dir="$RUNNER_TEMP/barrel_server"
          mkdir -p "$dir"
          tar xzf "barrel_server-$BARREL_BUNDLE-${{ matrix.target }}.tar.gz" -C "$dir"
          "$dir/bin/barrel_server" daemon
          for i in $(seq 30); do curl -fsS 127.0.0.1:8080/ready && break; sleep 2; done
          curl -fsS 127.0.0.1:8080/ready
          "$dir/bin/barrel_server" stop
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: barrel_server-${{ needs.plan.outputs.bundle }}-${{ matrix.target }}.tar.gz

  image:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      bundle: ${{ needs.plan.outputs.bundle }}
      ref: ${{ needs.plan.outputs.sha }}

  release:
    needs: [plan, tarball, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE: ${{ needs.plan.outputs.bundle }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$BUNDLE" -m "Barrel $BUNDLE" "${{ needs.plan.outputs.sha }}"
          git push origin "v$BUNDLE"
          gh release create "v$BUNDLE" --title "Barrel $BUNDLE" \
            --notes-file out/notes/notes.md out/tarball-*/*.tar.gz
