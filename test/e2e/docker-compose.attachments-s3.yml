# RustFS + Garage + two barrel_server peers, for the S3 attachment-backend
# suites (apps/barrel_att_s3/test, via the `s3` CI leg) and
# test/e2e/attachments-s3.sh. peer-a stays on the default (RocksDB)
# attachment backend; peer-b's databases point their att_opts at RustFS or
# Garage: same image, different runtime config per database.
#
# RustFS enforces conditional writes (If-None-Match/If-Match), Garage does
# not, so the two cover both paths of barrel_att_s3's capability probe.
# Images are pinned: an unpinned or vanished tag must fail loudly, not
# silently skip the suites. Neither store is usable until provisioned; run
# attachments-s3-setup.sh, the entry point of both the CI leg and the e2e.
#
# `name` keeps this project apart from docker-compose.yml, so neither
# `down --remove-orphans` removes the other's containers.

name: barrel-att-s3

services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: s3testadmin
      RUSTFS_SECRET_KEY: s3testsecret
    ports:
      - "19000:9000"

  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "13900:3900"
      - "13901:3901"
      - "13903:3903"

  peer-a:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
      args:
        RELX_PROFILES: s3_server,prod
        RELX_BUILD_DIR: s3_server+prod
    image: barrel-server-att-s3-e2e
    container_name: barrel-att-s3-peer-a
    ports:
      - "8093:8080"
    healthcheck:
      test: ["CMD", "barrel_server", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  peer-b:
    # Reuse the image peer-a builds.
    image: barrel-server-att-s3-e2e
    container_name: barrel-att-s3-peer-b
    depends_on:
      peer-a:
        condition: service_started
      rustfs:
        condition: service_started
      garage:
        condition: service_started
    ports:
      - "8094:8080"
    healthcheck:
      test: ["CMD", "barrel_server", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  garage-meta:
  garage-data:
